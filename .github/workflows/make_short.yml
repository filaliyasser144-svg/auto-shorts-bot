name: Auto Podcast to Shorts
on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'أدخل رابط يوتيوب للبودكاست'
        required: true
        type: string
jobs:
  build-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          yt-dlp --version
          node --version

      - name: Create Cookies File
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt
          if ! head -n 1 cookies.txt | grep -qi "netscape"; then
            echo "::warning::ملف الكوكيز ليس بصيغة Netscape"
          fi

      - name: Run Short Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_URL: ${{ github.event.inputs.youtube_url }}
        run: python main.py

      - name: Remove cookies
        if: always()
        run: rm -f cookies.txt
