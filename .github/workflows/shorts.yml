name: Shorts Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "رابط يوتيوب (اختياري - بدل تلغرام)"
        required: false
      mode:
        description: "النوع"
        type: choice
        options:
          - shorts
          - football
        default: shorts
      minutes:
        description: "مدة الملخص بالدقائق، أرقام فقط مثل 3 (لوضع football فقط)"
        required: false

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Poll Telegram
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_MIN: ${{ github.event.inputs.minutes }}
        run: python3 src/poll.py

      - name: Setup Python
        if: steps.poll.outputs.url != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Deno (needed by yt-dlp)
        if: steps.poll.outputs.url != ''
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system packages
        if: steps.poll.outputs.url != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install fonts (Arabic + English)
        if: steps.poll.outputs.url != ''
        run: |
          sudo apt-get install -y fonts-vazirmatn fonts-montserrat || true
          mkdir -p ~/.fonts
          for f in tajawal/Tajawal-Bold.ttf tajawal/Tajawal-ExtraBold.ttf poppins/Poppins-Bold.ttf poppins/Poppins-SemiBold.ttf; do
            curl -fsSL -o ~/.fonts/$(basename $f) "https://github.com/google/fonts/raw/main/ofl/$f" || true
          done
          fc-cache -f
          fc-list : family | grep -i -E "tajawal|poppins|vazirmatn|montserrat" | sort -u || true

      - name: Install Python packages
        if: steps.poll.outputs.url != ''
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        if: steps.poll.outputs.url != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'medium' }}

      - name: Optional YouTube cookies
        if: steps.poll.outputs.url != ''
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi

      - name: Make shorts
        if: steps.poll.outputs.url != '' && steps.poll.outputs.mode != 'football'
        env:
          VIDEO_URL: ${{ steps.poll.outputs.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
          NUM_CLIPS: ${{ vars.NUM_CLIPS }}
          LANG_CODE: ${{ vars.LANG_CODE }}
          HOOK_MODE: ${{ vars.HOOK_MODE }}
          TEXT_FIX: ${{ vars.TEXT_FIX }}
        run: python src/pipeline.py

      - name: Make football summary
        if: steps.poll.outputs.url != '' && steps.poll.outputs.mode == 'football'
        env:
          VIDEO_URL: ${{ steps.poll.outputs.url }}
          TARGET_MIN: ${{ steps.poll.outputs.minutes }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/football.py

      - name: Save outputs
        if: always() && steps.poll.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: out/*.mp4
          if-no-files-found: ignore

      - name: Notify on crash
        if: failure() && steps.poll.outputs.url != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ فشل التشغيل. راجع تبويب Actions في GitHub."
