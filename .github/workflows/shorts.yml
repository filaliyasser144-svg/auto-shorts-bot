name: Shorts Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "رابط يوتيوب (اختياري - بدل تلغرام)"
        required: false

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Poll Telegram
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_URL: ${{ github.event.inputs.url }}
        run: python3 src/poll.py

      - name: Setup Python
        if: steps.poll.outputs.url != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Deno (needed by yt-dlp)
        if: steps.poll.outputs.url != ''
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system packages
        if: steps.poll.outputs.url != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python packages
        if: steps.poll.outputs.url != ''
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        if: steps.poll.outputs.url != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'small' }}

      - name: Optional YouTube cookies
        if: steps.poll.outputs.url != ''
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi

      - name: Make shorts
        if: steps.poll.outputs.url != ''
        env:
          VIDEO_URL: ${{ steps.poll.outputs.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
          NUM_CLIPS: ${{ vars.NUM_CLIPS }}
          LANG_CODE: ${{ vars.LANG_CODE }}
        run: python src/pipeline.py

      - name: Save outputs
        if: always() && steps.poll.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: out/*.mp4
          if-no-files-found: ignore

      - name: Notify on crash
        if: failure() && steps.poll.outputs.url != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ فشل التشغيل. راجع تبويب Actions في GitHub."
